name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify frozen results
        run: python scripts/verify_frozen_results.py

      - name: Lint
        run: python -m ruff check src tests scripts/verify_frozen_results.py
