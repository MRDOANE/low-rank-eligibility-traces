[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "low-rank-eligibility-traces"
version = "0.2.0"
description = "Low-rank delayed-credit states: compression fidelity and competitive limits under delayed labels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Michael R. Doane"},
]
keywords = [
  "eligibility traces",
  "delayed credit assignment",
  "low-rank approximation",
  "reinforcement learning",
  "memory compression",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
external = [
  "huggingface-hub>=0.24,<2",
  "gdown>=5,<6",
  "pandas>=2.1,<3",
  "pillow>=10,<13",
  "psutil>=5.9,<8",
  "pyarrow>=14,<22",
  "scipy>=1.11,<2",
  "tqdm>=4.66,<5",
]

[project.urls]
Homepage = "https://github.com/MRDOANE/low-rank-eligibility-traces"
Repository = "https://github.com/MRDOANE/low-rank-eligibility-traces"
Issues = "https://github.com/MRDOANE/low-rank-eligibility-traces/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Preserve the exact experimentally executed source and tests. New repository
# infrastructure remains subject to the full lint profile.
"src/adaptive_memory/*.py" = ["E501", "F401", "F841", "I001"]
"tests/*.py" = ["F401", "I001"]
"external_validation/src/n08cascade/*.py" = ["E501", "I001"]
"external_validation/tests/*.py" = ["E501", "I001"]
